
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOOVI AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="logo">KOOVI AI</div>
    <button class="new-chat" onclick="newChat()">+ Новый чат</button>
    <div id="history"></div>
  </aside>

  <main>
    <h1>KOOVI AI</h1>
    <p class="subtitle">Твой искусственный интеллект</p>

    <div id="messages"></div>

    <div class="chat-box">
      <input id="message" placeholder="Напиши сообщение..." />
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
